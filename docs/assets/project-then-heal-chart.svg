  <rect x="46" y="79" width="13" height="13" rx="3" fill="#fb7185"/>
  <text x="66" y="90" fill="#e7e5e4" font-size="11.5" font-family="ui-monospace, monospace">Unconstrained LoRA Intrusion (% or max |D dW|)</text>
  <rect x="490" y="79" width="13" height="13" rx="3" fill="#34d399"/>
  <text x="510" y="90" fill="#e7e5e4" font-size="11.5" font-family="ui-monospace, monospace">ProjectThenHealLinear max |D dW| (f64 / F32)</text>

