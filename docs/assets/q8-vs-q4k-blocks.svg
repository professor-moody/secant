<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="100%" height="auto" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="960" height="310" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
  
  <text x="32" y="36" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.5" font-family="ui-monospace, monospace">QUANTIZED BLOCK ALIGNMENT WITH 128-COLUMN SSM_OUT VALUE-HEAD PANELS</text>
  <text x="32" y="60" fill="#f8fafc" font-size="18" font-weight="700">Why Q8_0 (32-Element Blocks) Commutes Exactly While Q4_K (256-Element Superblocks) Straddles</text>

  <!-- Panel Boundary Reference -->
  <rect x="260" y="80" width="320" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="420" y="102" fill="#38bdf8" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Value Head Panel h=0 (128 Columns: 0..127)</text>
  
  <rect x="590" y="80" width="320" height="34" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="750" y="102" fill="#c084fc" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Value Head Panel h=1 (128 Columns: 128..255)</text>

  <!-- Q8_0 Row -->
  <text x="32" y="152" fill="#34d399" font-size="14" font-weight="700">Q8_0 (34 B / 32 weights)</text>
  <text x="32" y="170" fill="#94a3b8" font-size="11.5">128 = 4 × 32 (Exact Partition)</text>
  <text x="32" y="186" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">98.5% refusal removed in-place</text>

  <!-- 8 Q8_0 blocks of 32 elements -->
  <g fill="#064e3b" stroke="#10b981" stroke-width="1.5" font-family="ui-monospace, monospace" font-size="11">
    <rect x="260" y="132" width="76" height="48" rx="6"/>
    <rect x="341" y="132" width="76" height="48" rx="6"/>
    <rect x="422" y="132" width="76" height="48" rx="6"/>
    <rect x="504" y="132" width="76" height="48" rx="6"/>
    
    <rect x="590" y="132" width="76" height="48" rx="6"/>
    <rect x="671" y="132" width="76" height="48" rx="6"/>
    <rect x="752" y="132" width="76" height="48" rx="6"/>
    <rect x="834" y="132" width="76" height="48" rx="6"/>
  </g>
  <g fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="10.5" text-anchor="middle">
    <text x="298" y="154">Blk 0</text><text x="298" y="170" fill="#34d399">32 el</text>
    <text x="379" y="154">Blk 1</text><text x="379" y="170" fill="#34d399">32 el</text>
    <text x="460" y="154">Blk 2</text><text x="460" y="170" fill="#34d399">32 el</text>
    <text x="542" y="154">Blk 3</text><text x="542" y="170" fill="#34d399">32 el</text>
    <text x="628" y="154">Blk 4</text><text x="628" y="170" fill="#34d399">32 el</text>
    <text x="709" y="154">Blk 5</text><text x="709" y="170" fill="#34d399">32 el</text>
    <text x="790" y="154">Blk 6</text><text x="790" y="170" fill="#34d399">32 el</text>
    <text x="872" y="154">Blk 7</text><text x="872" y="170" fill="#34d399">32 el</text>
  </g>

  <!-- Q4_K Row -->
  <text x="32" y="236" fill="#fb7185" font-size="14" font-weight="700">Q4_K (144 B / 256 weights)</text>
  <text x="32" y="254" fill="#94a3b8" font-size="11.5">256 spans TWO 128-col panels</text>
  <text x="32" y="270" fill="#fb7185" font-size="11" font-family="ui-monospace, monospace">Refused: superblockStraddleError</text>

  <rect x="260" y="212" width="650" height="64" rx="8" fill="#4c0519" stroke="#fb7185" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="585" y1="204" x2="585" y2="286" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="585" y="236" fill="#fda4af" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Single 256-Element Q4_K Superblock (Shared FP16 d &amp; dmin Across Both Heads!)</text>
  <text x="585" y="258" fill="#fbbf24" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">⚠ Panel boundary at col 128 cuts right through the shared superblock scale (67% of refusal survives)</text>
</svg>
