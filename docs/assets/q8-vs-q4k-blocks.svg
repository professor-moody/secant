<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="auto" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="960" height="340" rx="14" fill="#141413" stroke="#2e2d2b" stroke-width="1.5"/>

  <text x="32" y="36" fill="#a8a29e" font-size="11" font-weight="700" letter-spacing="1.4" font-family="ui-monospace, monospace">QUANTIZED BLOCK ALIGNMENT WITH 128-COLUMN SSM_OUT VALUE-HEAD PANELS</text>
  <text x="32" y="60" fill="#fafaf9" font-size="17.5" font-weight="700">Why Q8_0 (32-Weight Blocks) Commutes Exactly While Q4_K (256-Weight Superblocks) Straddles</text>
  <line x1="32" y1="74" x2="928" y2="74" stroke="#2e2d2b" stroke-width="1"/>

  <!-- Panel Boundary Reference -->
  <rect x="260" y="88" width="324" height="34" rx="6" fill="#1c1b1a" stroke="#57534e" stroke-width="1.5"/>
  <text x="422" y="109" fill="#e7e5e4" font-size="12" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Head Panel h=0 (128 cols: 0..127)</text>

  <rect x="596" y="88" width="324" height="34" rx="6" fill="#1c1b1a" stroke="#57534e" stroke-width="1.5"/>
  <text x="758" y="109" fill="#e7e5e4" font-size="12" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Head Panel h=1 (128 cols: 128..255)</text>

  <!-- Q8_0 Row -->
  <text x="32" y="156" fill="#34d399" font-size="13.5" font-weight="700">Q8_0 (34 B / 32 weights)</text>
  <text x="32" y="174" fill="#a8a29e" font-size="11.5">128 = 4 × 32 (Exact Partition)</text>
  <text x="32" y="191" fill="#34d399" font-size="11" font-family="ui-monospace, monospace">0 straddles; 98.5% ablated</text>

  <!-- 8 Q8_0 blocks of 32 elements -->
  <g fill="#064e3b" stroke="#10b981" stroke-width="1.2">
    <rect x="260" y="138" width="76" height="48" rx="5"/>
    <rect x="342" y="138" width="76" height="48" rx="5"/>
    <rect x="425" y="138" width="76" height="48" rx="5"/>
    <rect x="508" y="138" width="76" height="48" rx="5"/>

    <rect x="596" y="138" width="76" height="48" rx="5"/>
    <rect x="678" y="138" width="76" height="48" rx="5"/>
    <rect x="761" y="138" width="76" height="48" rx="5"/>
    <rect x="844" y="138" width="76" height="48" rx="5"/>
  </g>
  <g fill="#d1fae5" font-family="ui-monospace, monospace" font-size="10.5" text-anchor="middle">
    <text x="298" y="159" font-weight="700">Blk 0</text><text x="298" y="175" fill="#6ee7b7">32 wts</text>
    <text x="380" y="159" font-weight="700">Blk 1</text><text x="380" y="175" fill="#6ee7b7">32 wts</text>
    <text x="463" y="159" font-weight="700">Blk 2</text><text x="463" y="175" fill="#6ee7b7">32 wts</text>
    <text x="546" y="159" font-weight="700">Blk 3</text><text x="546" y="175" fill="#6ee7b7">32 wts</text>
    <text x="634" y="159" font-weight="700">Blk 4</text><text x="634" y="175" fill="#6ee7b7">32 wts</text>
    <text x="716" y="159" font-weight="700">Blk 5</text><text x="716" y="175" fill="#6ee7b7">32 wts</text>
    <text x="799" y="159" font-weight="700">Blk 6</text><text x="799" y="175" fill="#6ee7b7">32 wts</text>
    <text x="882" y="159" font-weight="700">Blk 7</text><text x="882" y="175" fill="#6ee7b7">32 wts</text>
  </g>

  <!-- Q4_K Row -->
  <text x="32" y="236" fill="#fb7185" font-size="13.5" font-weight="700">Q4_K (144 B / 256 weights)</text>
  <text x="32" y="254" fill="#a8a29e" font-size="11.5">256 spans TWO 128-col panels</text>
  <text x="32" y="271" fill="#fb7185" font-size="11" font-family="ui-monospace, monospace">Refused: superblockStraddleError</text>

  <!-- Single Q4_K Superblock with clean split labels so vertical line never touches text -->
  <rect x="260" y="214" width="660" height="60" rx="7" fill="#3f111c" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="395" y="241" fill="#fecdd3" font-size="11.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Cols 0..127 (Head h=0)</text>
  <text x="395" y="259" fill="#fda4af" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">Shares FP16 d &amp; dmin</text>

  <text x="785" y="241" fill="#fecdd3" font-size="11.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Cols 128..255 (Head h=1)</text>
  <text x="785" y="259" fill="#fda4af" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">Shares FP16 d &amp; dmin</text>

  <!-- Vertical boundary line and centered badge -->
  <line x1="590" y1="204" x2="590" y2="284" stroke="#fbbf24" stroke-width="2.2"/>
  <rect x="522" y="232" width="136" height="24" rx="4" fill="#451a03" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="590" y="248" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">COL 128 STRADDLE</text>

  <!-- Bottom note outside box -->
  <text x="590" y="312" fill="#fbbf24" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">Single 256-weight Q4_K superblock spans both heads: 67% of refusal survives post-quant re-encoding</text>
</svg>
