  <rect x="756" y="100" width="70" height="20" rx="4" fill="#064e3b"/>
  <text x="791" y="114" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">STAGE 4</text>
  <text x="756" y="140" fill="#f8fafc" font-size="14" font-weight="700">Project-Then-Heal</text>
  <text x="756" y="160" fill="#94a3b8" font-size="11.5">Lock LoRA inside P_perp</text>
  <text x="756" y="176" fill="#94a3b8" font-size="11.5">(&lt; 10⁻¹⁵ f64 leakage)</text>
  <rect x="756" y="194" width="162" height="42" rx="6" fill="#090d16" stroke="#1e293b"/>
  <text x="764" y="211" fill="#34d399" font-size="10.5" font-family="ui-monospace, monospace">ProjectThenHealLinear</text>
  <text x="764" y="227" fill="#34d399" font-size="10.5" font-family="ui-monospace, monospace">secant heal / verify</text>
