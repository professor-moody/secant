<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" width="100%" height="auto" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect width="1080" height="390" rx="10" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="1" y="1" width="1078" height="52" rx="9" fill="#0f172a"/>
  <rect x="1" y="42" width="1078" height="11" fill="#0f172a"/>
  <text x="24" y="23" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SECANT WEIGHT-SPACE PROGRAMMING ENGINE · END-TO-END MATHEMATICAL PIPELINE</text>
  <text x="24" y="42" fill="#f8fafc" font-size="14.5" font-weight="600">Zero-Eval Spectral Auditing  →  Calibrated Multi-Subspace Composition  →  In-Place mmap &amp; Q8_0 Block Surgery  →  Project-Then-Heal Locked LoRA</text>

  <!-- ==================== STAGE 1: ZERO-EVAL SPECTRAL & PAYLOAD AUDIT ==================== -->
  <g transform="translate(18, 68)">
    <rect width="242" height="298" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="0" y="0" width="242" height="6" rx="3" fill="#334155"/>
    <text x="14" y="26" fill="#475569" font-size="10" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, monospace">01 · STATIC WEIGHT AUDIT</text>
    <text x="14" y="45" fill="#0f172a" font-size="14" font-weight="700">Read &amp; Sanitize on Disk</text>

    <!-- Mini Diagram: Disk Tensor SVD + Vocab Projection -->
    <rect x="14" y="56" width="214" height="104" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="24" y="73" fill="#334155" font-size="10.5" font-weight="600">Read-Only mmap (.safetensors / .gguf)</text>
    <!-- Singular value bars -->
    <rect x="26" y="84" width="12" height="44" rx="2" fill="#0284c7"/>
    <rect x="43" y="96" width="12" height="32" rx="2" fill="#0ea5e9"/>
    <rect x="60" y="106" width="12" height="22" rx="2" fill="#38bdf8"/>
    <rect x="77" y="114" width="12" height="14" rx="2" fill="#7dd3fc"/>
    <rect x="94" y="119" width="12" height="9" rx="2" fill="#bae6fd"/>
    <line x1="22" y1="128" x2="112" y2="128" stroke="#64748b" stroke-width="1"/>
    <text x="26" y="142" fill="#475569" font-size="9.5" font-family="ui-monospace, monospace">W = U Σ Vᵀ (float64)</text>

    <!-- Arrow to Vocab / Boundary Check -->
    <line x1="114" y1="106" x2="132" y2="106" stroke="#475569" stroke-width="1.2" marker-end="url(#arrowSlate)"/>
    <rect x="136" y="80" width="84" height="58" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="143" y="95" fill="#0f172a" font-size="9.5" font-weight="600">Vocab &amp; Bounds</text>
    <text x="143" y="110" fill="#475569" font-size="9" font-family="ui-monospace, monospace">u_iᵀ W_vocab</text>
    <text x="143" y="123" fill="#dc2626" font-size="9" font-family="ui-monospace, monospace">NaN / Inf / MoE</text>

    <!-- Mathematical Invariants -->
    <text x="14" y="178" fill="#0f172a" font-size="11" font-weight="700">Verified Invariants</text>
    <text x="14" y="195" fill="#334155" font-size="10.5">• Non-FMA deterministic float64 SVD</text>
    <text x="14" y="211" fill="#334155" font-size="10.5">• Direct token unembedding projection</text>
    <text x="14" y="227" fill="#334155" font-size="10.5">• Boundary-3 NaN / subnormal / router audit</text>

    <!-- CLI Box -->
    <rect x="14" y="242" width="214" height="44" rx="5" fill="#0f172a"/>
    <text x="22" y="260" fill="#38bdf8" font-size="10.5" font-family="ui-monospace, SFMono-Regular, monospace">secant inspect | secant read</text>
    <text x="22" y="276" fill="#cbd5e1" font-size="10.5" font-family="ui-monospace, SFMono-Regular, monospace">secant sanitize | secant probe</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="260" y1="217" x2="276" y2="217" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>

  <!-- ==================== STAGE 2: CALIBRATED MULTI-SUBSPACE COMPOSITION ==================== -->
  <g transform="translate(278, 68)">
    <rect width="252" height="298" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="0" y="0" width="252" height="6" rx="3" fill="#0284c7"/>
    <text x="14" y="26" fill="#0369a1" font-size="10" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, monospace">02 · ORTHOGONAL CALIBRATION</text>
    <text x="14" y="45" fill="#0f172a" font-size="14" font-weight="700">Capture &amp; Target-Shift Solve</text>

    <!-- Mini Diagram: Orthogonal Basis D and Target-Shift Calibration -->
    <rect x="14" y="56" width="224" height="104" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <!-- Coordinate axes showing Gram-Schmidt orthonormal triad -->
    <g transform="translate(56, 126)">
      <line x1="0" y1="0" x2="42" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)"/>
      <line x1="0" y1="0" x2="0" y2="-42" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)"/>
      <line x1="0" y1="0" x2="-26" y2="20" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)"/>
      <rect x="0" y="-8" width="8" height="8" fill="none" stroke="#0369a1" stroke-width="1"/>
      <text x="45" y="4" fill="#0369a1" font-size="9.5" font-weight="700" font-family="ui-monospace, monospace">d₁</text>
      <text x="-6" y="-46" fill="#0369a1" font-size="9.5" font-weight="700" font-family="ui-monospace, monospace">d₂</text>
      <text x="-42" y="26" fill="#0369a1" font-size="9.5" font-weight="700" font-family="ui-monospace, monospace">d₃</text>
    </g>
    <text x="116" y="78" fill="#0f172a" font-size="10" font-weight="700">Gram-Schmidt Triad</text>
    <text x="116" y="94" fill="#0369a1" font-size="10" font-family="ui-monospace, monospace">D Dᵀ = I_k  (f64)</text>
    <line x1="116" y1="103" x2="228" y2="103" stroke="#bae6fd" stroke-width="1"/>
    <text x="116" y="118" fill="#0f172a" font-size="10" font-weight="700">Target-Shift Step</text>
    <text x="116" y="134" fill="#0369a1" font-size="10" font-family="ui-monospace, monospace">β = |Δ_target| / ‖h_S‖₂²</text>
    <text x="116" y="149" fill="#475569" font-size="9" font-family="ui-monospace, monospace">W' = W - Σ β_i d_i (d_iᵀ W)</text>

    <!-- Mathematical Invariants -->
    <text x="14" y="178" fill="#0f172a" font-size="11" font-weight="700">Verified Invariants</text>
    <text x="14" y="195" fill="#334155" font-size="10.5">• Layer selection via held-out SNR_proj</text>
    <text x="14" y="211" fill="#334155" font-size="10.5">• Two-pass Gram-Schmidt (&lt; 1e-12 ortho)</text>
    <text x="14" y="227" fill="#334155" font-size="10.5">• Scale-invariant activation shift across sizes</text>

    <!-- CLI Box -->
    <rect x="14" y="242" width="224" height="44" rx="5" fill="#0f172a"/>
    <text x="22" y="260" fill="#38bdf8" font-size="10.5" font-family="ui-monospace, SFMono-Regular, monospace">secant.capture (SNR_proj)</text>
    <text x="22" y="276" fill="#cbd5e1" font-size="10.5" font-family="ui-monospace, SFMono-Regular, monospace">secant compose --target-shift</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="530" y1="217" x2="546" y2="217" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>

  <!-- ==================== STAGE 3: IN-PLACE MMAP & Q8_0 BLOCK SURGERY ==================== -->
  <g transform="translate(548, 68)">
    <rect width="248" height="298" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="0" y="0" width="248" height="6" rx="3" fill="#d97706"/>
    <text x="14" y="26" fill="#b45309" font-size="10" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, monospace">03 · IN-PLACE DISK SURGERY</text>
    <text x="14" y="45" fill="#0f172a" font-size="14" font-weight="700">Zero-Copy mmap &amp; Q8_0 Patch</text>

    <!-- Mini Diagram: Byte-range mmap + 34-byte Q8_0 block grid -->
    <rect x="14" y="56" width="220" height="104" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="22" y="72" fill="#92400e" font-size="9.5" font-weight="700" font-family="ui-monospace, monospace">File Byte Layout (98%+ Untouched)</text>
    <!-- File byte bar -->
    <rect x="22" y="79" width="44" height="18" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="44" y="91" fill="#475569" font-size="8.5" text-anchor="middle" font-family="ui-monospace, monospace">Header</text>
    <rect x="68" y="79" width="48" height="18" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="92" y="91" fill="#475569" font-size="8.5" text-anchor="middle" font-family="ui-monospace, monospace">Tensors</text>
    <rect x="118" y="79" width="52" height="18" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="144" y="91" fill="#b45309" font-size="8.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Patched</text>
    <rect x="172" y="79" width="54" height="18" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="199" y="91" fill="#475569" font-size="8.5" text-anchor="middle" font-family="ui-monospace, monospace">Tensors</text>

    <!-- 128-col Head = 4 x 32 Q8_0 blocks -->
    <text x="22" y="113" fill="#0f172a" font-size="9.5" font-weight="600">Π₁₂₈ Head Grid = 4 × 32-wt Q8_0 (34B)</text>
    <rect x="22" y="120" width="48" height="18" rx="2" fill="#fde68a" stroke="#d97706"/>
    <text x="46" y="132" fill="#92400e" font-size="8.5" text-anchor="middle" font-family="ui-monospace, monospace">f16|32×i8</text>
    <rect x="73" y="120" width="48" height="18" rx="2" fill="#fde68a" stroke="#d97706"/>
    <text x="97" y="132" fill="#92400e" font-size="8.5" text-anchor="middle" font-family="ui-monospace, monospace">f16|32×i8</text>
    <rect x="124" y="120" width="48" height="18" rx="2" fill="#fde68a" stroke="#d97706"/>
    <text x="148" y="132" fill="#92400e" font-size="8.5" text-anchor="middle" font-family="ui-monospace, monospace">f16|32×i8</text>
    <rect x="175" y="120" width="48" height="18" rx="2" fill="#fde68a" stroke="#d97706"/>
    <text x="199" y="132" fill="#92400e" font-size="8.5" text-anchor="middle" font-family="ui-monospace, monospace">f16|32×i8</text>
    <text x="22" y="152" fill="#475569" font-size="9" font-family="ui-monospace, monospace">SHA-256 pre/post byte-range proof</text>

    <!-- Mathematical Invariants -->
    <text x="14" y="178" fill="#0f172a" font-size="11" font-weight="700">Verified Invariants</text>
    <text x="14" y="195" fill="#334155" font-size="10.5">• Zero PyTorch / zero full-file re-serialization</text>
    <text x="14" y="211" fill="#334155" font-size="10.5">• Direct 34B Q8_0 block decode-project-pack</text>
    <text x="14" y="227" fill="#334155" font-size="10.5">• Rejects unsafe 256-wt Q4_K head straddling</text>

    <!-- CLI Box -->
    <rect x="14" y="242" width="220" height="44" rx="5" fill="#0f172a"/>
    <text x="22" y="260" fill="#fbbf24" font-size="10.5" font-family="ui-monospace, SFMono-Regular, monospace">secant patch | verify-patch</text>
    <text x="22" y="276" fill="#cbd5e1" font-size="10.5" font-family="ui-monospace, SFMono-Regular, monospace">secant quant patch | witness</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <line x1="796" y1="217" x2="812" y2="217" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>

  <!-- ==================== STAGE 4: PROJECT-THEN-HEAL SUBSPACE-LOCKED LORA ==================== -->
  <g transform="translate(814, 68)">
    <rect width="248" height="298" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="0" y="0" width="248" height="6" rx="3" fill="#059669"/>
    <text x="14" y="26" fill="#047857" font-size="10" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, monospace">04 · PROJECT-THEN-HEAL LORA</text>
    <text x="14" y="45" fill="#0f172a" font-size="14" font-weight="700">Subspace-Locked Fine-Tuning</text>

    <!-- Mini Diagram: Orthogonal Wall P_perp blocking AdamW rotation into span(D) -->
    <rect x="14" y="56" width="220" height="104" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <!-- Shaded forbidden zone span(D) on right, allowed ker(D) on left -->
    <rect x="144" y="62" width="84" height="92" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="3,2"/>
    <text x="186" y="76" fill="#991b1b" font-size="9" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">span(D)</text>
    <text x="186" y="88" fill="#b91c1c" font-size="8.5" text-anchor="middle">Excised</text>
    <!-- Unconstrained AdamW rotation arrow leaking into span(D) -->
    <path d="M 40 132 Q 110 132 168 112" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowRed)"/>
    <text x="30" y="147" fill="#dc2626" font-size="8.5" font-family="ui-monospace, monospace">AdamW S_t⁻¹g_t leaks</text>

    <!-- Structural Wall at x=144 -->
    <line x1="144" y1="60" x2="144" y2="156" stroke="#059669" stroke-width="2.5"/>
    <!-- Locked B arrow staying strictly on P_perp wall -->
    <line x1="36" y1="98" x2="136" y2="74" stroke="#059669" stroke-width="2" marker-end="url(#arrowEmerald)"/>
    <text x="24" y="76" fill="#065f46" font-size="9.5" font-weight="700" font-family="ui-monospace, monospace">ker(D) = Im(P_⊥)</text>
    <text x="24" y="91" fill="#047857" font-size="9" font-family="ui-monospace, monospace">B_lock = P_⊥(P_⊥(B̃))</text>
    <text x="24" y="118" fill="#065f46" font-size="9" font-weight="600" font-family="ui-monospace, monospace">‖D B_lock‖ ≤ 10⁻¹⁷ (f64)</text>

    <!-- Mathematical Invariants -->
    <text x="14" y="178" fill="#0f172a" font-size="11" font-weight="700">Verified Invariants</text>
    <text x="14" y="195" fill="#334155" font-size="10.5">• Defeats AdamW diagonal S_t⁻¹ rotation</text>
    <text x="14" y="211" fill="#334155" font-size="10.5">• Double projection P_⊥(P_⊥(B̃)) in float64</text>
    <text x="14" y="227" fill="#334155" font-size="10.5">• Zero dense d_out × d_out matrix allocation</text>

    <!-- CLI Box -->
    <rect x="14" y="242" width="220" height="44" rx="5" fill="#0f172a"/>
    <text x="22" y="260" fill="#34d399" font-size="10.5" font-family="ui-monospace, SFMono-Regular, monospace">secant.nn.ProjectThenHealLinear</text>
    <text x="22" y="276" fill="#cbd5e1" font-size="10.5" font-family="ui-monospace, SFMono-Regular, monospace">secant heal | verify-subspace</text>
  </g>
</svg>
