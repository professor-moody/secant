  <text x="77" y="114" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">STAGE 1</text>
  <text x="42" y="140" fill="#f8fafc" font-size="14" font-weight="700">Read &amp; Sanitize</text>
  <text x="42" y="160" fill="#94a3b8" font-size="11.5">Zero-eval SVD spectrum &amp;</text>
  <text x="42" y="176" fill="#94a3b8" font-size="11.5">Boundary-3 kernel defense</text>
  <rect x="42" y="194" width="177" height="42" rx="6" fill="#090d16" stroke="#1e293b"/>
  <text x="50" y="211" fill="#38bdf8" font-size="10.5" font-family="ui-monospace, monospace">secant inspect / read</text>
  <text x="50" y="227" fill="#38bdf8" font-size="10.5" font-family="ui-monospace, monospace">secant sanitize / probe</text>

  <!-- Arrow 1->2 -->
  <path d="M 237 168 L 255 168" stroke="#475569" stroke-width="2" fill="none"/>
  <polygon points="255,163 263,168 255,173" fill="#475569"/>

  <!-- Stage 2 -->
  <rect x="266" y="86" width="205" height="164" rx="12" fill="#111827" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="280" y="100" width="70" height="20" rx="4" fill="#3b0764"/>
  <text x="315" y="114" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">STAGE 2</text>
  <text x="280" y="140" fill="#f8fafc" font-size="14" font-weight="700">Capture &amp; Compose</text>
  <text x="280" y="160" fill="#94a3b8" font-size="11.5">Gram-Schmidt basis D +</text>
  <text x="280" y="176" fill="#94a3b8" font-size="11.5">Target-Shift Calibration</text>
  <rect x="280" y="194" width="177" height="42" rx="6" fill="#090d16" stroke="#1e293b"/>
  <text x="288" y="211" fill="#c084fc" font-size="10.5" font-family="ui-monospace, monospace">secant.capture (SNR)</text>
  <text x="288" y="227" fill="#c084fc" font-size="10.5" font-family="ui-monospace, monospace">secant compose</text>

  <!-- Arrow 2->3 -->
  <path d="M 475 168 L 493 168" stroke="#475569" stroke-width="2" fill="none"/>
  <polygon points="493,163 501,168 493,173" fill="#475569"/>

  <!-- Stage 3 -->
  <rect x="504" y="86" width="205" height="164" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="518" y="100" width="70" height="20" rx="4" fill="#451a03"/>
  <text x="553" y="114" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">STAGE 3</text>
  <text x="518" y="140" fill="#f8fafc" font-size="14" font-weight="700">Zero-Copy Patch</text>
