  <rect x="518" y="194" width="177" height="42" rx="6" fill="#090d16" stroke="#1e293b"/>
  <text x="526" y="211" fill="#fbbf24" font-size="10.5" font-family="ui-monospace, monospace">secant patch / verify</text>
  <text x="526" y="227" fill="#fbbf24" font-size="10.5" font-family="ui-monospace, monospace">secant quant patch</text>

  <!-- Arrow 3->4 -->
  <path d="M 713 168 L 731 168" stroke="#475569" stroke-width="2" fill="none"/>
  <polygon points="731,163 739,168 731,173" fill="#475569"/>

  <!-- Stage 4 -->
