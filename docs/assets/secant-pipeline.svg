<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="auto" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="960" height="280" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Header -->
  <text x="32" y="38" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.5" font-family="ui-monospace, SFMono-Regular, monospace">SECANT END-TO-END WEIGHT-SPACE ENGINE</text>
  <text x="32" y="62" fill="#f8fafc" font-size="18" font-weight="700">From Static Weight Auditing to Subspace-Locked LoRA Healing</text>

  <!-- Stage 1 -->
