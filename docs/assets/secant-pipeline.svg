<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="100%" height="auto" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="960" height="290" rx="14" fill="#141413" stroke="#2e2d2b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="36" fill="#a8a29e" font-size="11" font-weight="700" letter-spacing="1.4" font-family="ui-monospace, SFMono-Regular, monospace">SECANT FOUR-STAGE WEIGHT-SPACE ARCHITECTURE</text>
  <text x="32" y="60" fill="#fafaf9" font-size="18" font-weight="700">From Static Weight Auditing to Subspace-Locked LoRA Healing</text>
  <line x1="32" y1="74" x2="928" y2="74" stroke="#2e2d2b" stroke-width="1"/>

  <!-- Stage 1 -->
  <rect x="28" y="92" width="206" height="172" rx="10" fill="#1c1b1a" stroke="#44403c" stroke-width="1.5"/>
  <rect x="42" y="106" width="76" height="20" rx="4" fill="#292524"/>
  <text x="80" y="120" fill="#d6d3d1" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">STAGE 1</text>
  <text x="42" y="146" fill="#fafaf9" font-size="14" font-weight="700">Read &amp; Sanitize</text>
  <text x="42" y="166" fill="#a8a29e" font-size="11.5">Zero-eval SVD spectrum &amp;</text>
  <text x="42" y="182" fill="#a8a29e" font-size="11.5">Boundary-3 kernel checks</text>
  <rect x="42" y="200" width="178" height="48" rx="6" fill="#141413" stroke="#2e2d2b"/>
  <text x="50" y="218" fill="#e7e5e4" font-size="10.5" font-family="ui-monospace, monospace">secant inspect / read</text>
  <text x="50" y="236" fill="#a8a29e" font-size="10.5" font-family="ui-monospace, monospace">secant sanitize / probe</text>

  <!-- Arrow 1->2 -->
  <path d="M 238 178 L 256 178" stroke="#78716c" stroke-width="1.8" fill="none"/>
  <polygon points="256,173.5 264,178 256,182.5" fill="#78716c"/>

  <!-- Stage 2 -->
  <rect x="268" y="92" width="206" height="172" rx="10" fill="#1c1b1a" stroke="#44403c" stroke-width="1.5"/>
  <rect x="282" y="106" width="76" height="20" rx="4" fill="#292524"/>
  <text x="320" y="120" fill="#d6d3d1" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">STAGE 2</text>
  <text x="282" y="146" fill="#fafaf9" font-size="14" font-weight="700">Capture &amp; Compose</text>
  <text x="282" y="166" fill="#a8a29e" font-size="11.5">Orthonormal basis D D^T = I</text>
  <text x="282" y="182" fill="#a8a29e" font-size="11.5">&amp; Target-Shift Calibration</text>
  <rect x="282" y="200" width="178" height="48" rx="6" fill="#141413" stroke="#2e2d2b"/>
  <text x="290" y="218" fill="#e7e5e4" font-size="10.5" font-family="ui-monospace, monospace">secant.capture (SNR)</text>
  <text x="290" y="236" fill="#a8a29e" font-size="10.5" font-family="ui-monospace, monospace">secant compose</text>

  <!-- Arrow 2->3 -->
  <path d="M 478 178 L 496 178" stroke="#78716c" stroke-width="1.8" fill="none"/>
  <polygon points="496,173.5 504,178 496,182.5" fill="#78716c"/>

  <!-- Stage 3 -->
  <rect x="508" y="92" width="206" height="172" rx="10" fill="#1c1b1a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="522" y="106" width="76" height="20" rx="4" fill="#451a03"/>
  <text x="560" y="120" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">STAGE 3</text>
  <text x="522" y="146" fill="#fafaf9" font-size="14" font-weight="700">Zero-Copy Patch</text>
  <text x="522" y="166" fill="#a8a29e" font-size="11.5">mmap SafeTensors/GGUF &amp;</text>
  <text x="522" y="182" fill="#a8a29e" font-size="11.5">34B Q8_0 block surgery</text>
  <rect x="522" y="200" width="178" height="48" rx="6" fill="#141413" stroke="#2e2d2b"/>
  <text x="530" y="218" fill="#fbbf24" font-size="10.5" font-family="ui-monospace, monospace">secant patch / verify</text>
  <text x="530" y="236" fill="#d6d3d1" font-size="10.5" font-family="ui-monospace, monospace">secant quant patch</text>

  <!-- Arrow 3->4 -->
  <path d="M 718 178 L 736 178" stroke="#78716c" stroke-width="1.8" fill="none"/>
  <polygon points="736,173.5 744,178 736,182.5" fill="#78716c"/>

  <!-- Stage 4 -->
  <rect x="748" y="92" width="184" height="172" rx="10" fill="#1c1b1a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="762" y="106" width="76" height="20" rx="4" fill="#064e3b"/>
  <text x="800" y="120" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">STAGE 4</text>
  <text x="762" y="146" fill="#fafaf9" font-size="14" font-weight="700">Project-Then-Heal</text>
  <text x="762" y="166" fill="#a8a29e" font-size="11.5">Lock LoRA inside P_perp</text>
  <text x="762" y="182" fill="#a8a29e" font-size="11.5">(f64: 1e-17 live, 1e-9 H100)</text>
  <rect x="762" y="200" width="156" height="48" rx="6" fill="#141413" stroke="#2e2d2b"/>
  <text x="770" y="218" fill="#34d399" font-size="10.5" font-family="ui-monospace, monospace">ProjectThenHealLinear</text>
  <text x="770" y="236" fill="#d6d3d1" font-size="10.5" font-family="ui-monospace, monospace">secant heal / verify</text>
</svg>
