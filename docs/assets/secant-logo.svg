<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="secantPlane" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="secantAccent" x1="8" y1="54" x2="56" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <!-- Orthogonal Subspace Plane P_perp -->
  <polygon points="10,42 30,24 54,30 34,48" fill="url(#secantPlane)" stroke="#38bdf8" stroke-width="1.6"/>
  <!-- Right-angle orthogonality marker -->
  <polyline points="32,37 37,33 37,27" stroke="#10b981" stroke-width="1.8" fill="none"/>
  <!-- Locked Subspace Basis Vector d_i (vertical normal) -->
  <line x1="32" y1="37" x2="32" y2="11" stroke="#f85149" stroke-width="2.6" stroke-linecap="round"/>
  <polygon points="32,8 28,15 36,15" fill="#f85149"/>
  <!-- Secant Trajectory & Orthogonal Projection Vector -->
  <path d="M 14 50 Q 30 35 50 16" stroke="url(#secantAccent)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <circle cx="32" cy="37" r="3.4" fill="#10b981" stroke="#0d1117" stroke-width="1.2"/>
  <circle cx="49" cy="17" r="3.2" fill="#38bdf8"/>
</svg>
