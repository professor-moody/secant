name: Secant static weight audit
description: Run Secant's fail-closed static sanitizer on a GGUF or SafeTensors model
author: professor-moody

branding:
  icon: shield
  color: purple

inputs:
  model:
    description: Path to the .gguf or .safetensors file to scan
    required: true
  receipt:
    description: Path for the secant.wsp.sanitize.v1 JSON receipt
    required: false
    default: secant-sanitize.json
  attempt-id:
    description: Stable identity recorded in the receipt
    required: false
    default: github-action
  num-experts:
    description: Exclusive routed-expert bound, or 0 when not applicable
    required: false
    default: "0"
  sarif-out:
    description: Optional path for a SARIF 2.1.0 report (for github/codeql-action/upload-sarif@v3)
    required: false
    default: ""

outputs:
  receipt:
    description: Path to the sanitizer receipt
    value: ${{ inputs.receipt }}
  sarif-out:
    description: Path to the SARIF 2.1.0 report, if requested
    value: ${{ inputs.sarif-out }}

runs:
  using: composite
  steps:
    - name: Install Secant
      shell: bash
      run: |
        cargo install --locked --path "$GITHUB_ACTION_PATH/crates/secant-cli" --root "$RUNNER_TEMP/secant-action"
        echo "$RUNNER_TEMP/secant-action/bin" >> "$GITHUB_PATH"
    - name: Sanitize model
      shell: bash
      # Inputs reach the script only as environment variables, never as
      # interpolated shell source, so their values are always data.
      env:
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_RECEIPT: ${{ inputs.receipt }}
        INPUT_ATTEMPT_ID: ${{ inputs.attempt-id }}
        INPUT_NUM_EXPERTS: ${{ inputs.num-experts }}
        INPUT_SARIF_OUT: ${{ inputs.sarif-out }}
      run: |
        args=(
          --model="$INPUT_MODEL"
          --receipt="$INPUT_RECEIPT"
          --attempt-id="$INPUT_ATTEMPT_ID"
          --num-experts="$INPUT_NUM_EXPERTS"
          --dry-run
          --json
        )
        if [ -n "$INPUT_SARIF_OUT" ]; then
          args+=(--sarif="$INPUT_SARIF_OUT")
        fi
        secant sanitize "${args[@]}"
