[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secant"
version = "0.3.0"
description = "Python bindings for Secant: Project-Then-Heal LoRA, contrastive direction capture, and a bridge to the secant CLI and C ABI"
authors = [{ name = "Nathan Keys", email = "professor.moody@pm.me" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["numpy"]

[project.optional-dependencies]
torch = ["torch"]
test = ["pytest", "numpy"]

[tool.setuptools]
packages = ["secant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
